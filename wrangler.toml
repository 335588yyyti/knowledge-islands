# 知識群島：Cloudflare Worker（後端程式）＋靜態網頁（public/）＋ D1 資料庫
name = "knowledge-islands"
main = "src/worker.js"
# Cloudflare 帳戶 ID 不寫在這裡（避免公開），部署時由權杖自動判斷，或讀取 GitHub 的 CLOUDFLARE_ACCOUNT_ID
compatibility_date = "2026-10-01"

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "knowledge-islands"
# 第一次部署時，GitHub Actions 會自動建立資料庫並填入這個 id
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
